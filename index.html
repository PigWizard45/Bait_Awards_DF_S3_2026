<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BAIT PRESENTS: THE BEST OFs AWARD SHOW!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;

      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(197, 151, 54, 0.24),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(119, 20, 35, 0.34),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #08080b 0%,
          #150912 55%,
          #050507 100%
        );
    }

    /* Moving award-show spotlight */

    .spotlight {
      position: fixed;
      inset: -20%;
      pointer-events: none;

      background:
        conic-gradient(
          from 198deg at 50% 0%,
          transparent 0 42%,
          rgba(224, 190, 104, 0.09) 46%,
          transparent 50% 100%
        );

      animation: sweep 8s ease-in-out infinite alternate;
    }

    @keyframes sweep {
      from {
        transform: rotate(-8deg);
      }

      to {
        transform: rotate(8deg);
      }
    }

    /* Main content */

    .wrap {
      width: min(1000px, 92vw);
      text-align: center;
      padding: 48px 24px;

      position: relative;
      z-index: 1;
    }

    /* BAIT PRESENTS */

    .presented {
      color: #e7d29b;

      font-size: clamp(
        0.8rem,
        2vw,
        1.15rem
      );

      letter-spacing: 0.42em;
      font-weight: 700;

      margin-bottom: 16px;
    }

    /* Main title */

    h1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(
        2.8rem,
        8vw,
        6.8rem
      );

      line-height: 0.95;

      text-transform: uppercase;

      color: #e8bd53;

      text-shadow:
        0 2px 0 #72540d,
        0 0 18px rgba(232, 189, 83, 0.35),
        0 0 55px rgba(232, 189, 83, 0.18);
    }

    /* Hosted by */

    .hosted {
      margin:
        20px
        0
        44px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(
        1rem,
        2.6vw,
        1.55rem
      );

      font-style: italic;

      color: #f7f0df;
    }

    /* Countdown heading */

    .label {
      margin-bottom: 12px;

      color: #c7b98f;

      text-transform: uppercase;

      letter-spacing: 0.2em;

      font-size: 0.78rem;

      font-weight: 700;
    }

    /* Countdown */

    #countdown {
      display: flex;

      justify-content: center;

      gap: clamp(
        8px,
        2vw,
        20px
      );

      flex-wrap: wrap;
    }

    .unit {
      min-width: clamp(
        74px,
        15vw,
        135px
      );

      padding:
        18px
        12px
        14px;

      border:
        1px solid
        rgba(232, 189, 83, 0.45);

      border-radius: 12px;

      background:
        rgba(
          0,
          0,
          0,
          0.38
        );

      box-shadow:
        inset
        0 0 25px
        rgba(232, 189, 83, 0.05),

        0 10px 40px
        rgba(0, 0, 0, 0.28);

      backdrop-filter: blur(4px);
    }

    .number {
      display: block;

      font-variant-numeric:
        tabular-nums;

      font-size: clamp(
        2rem,
        6vw,
        4.4rem
      );

      line-height: 1;

      font-weight: 800;

      color: #fff8df;
    }

    .unit-name {
      display: block;

      margin-top: 8px;

      font-size: clamp(
        0.55rem,
        1.5vw,
        0.75rem
      );

      color: #d6bd78;

      text-transform:
        uppercase;

      letter-spacing:
        0.14em;
    }

    /* Date / live message */

    #status {
      min-height: 1.5em;

      margin-top: 26px;

      color: #c7b98f;

      font-size: 0.82rem;

      letter-spacing:
        0.08em;
    }

    /* When countdown reaches zero */

    .live h1 {
      color: #fff0aa;
    }

    .live #status {
      color: #e8bd53;

      font-size: 1.1rem;

      font-weight: 700;
    }

    /* Small-screen adjustment */

    @media (max-width: 500px) {

      .wrap {
        padding:
          32px
          12px;
      }

      .hosted {
        margin-bottom:
          32px;
      }

      .unit {
        min-width:
          70px;
      }
    }

  </style>
</head>

<body>

  <!-- Moving background spotlight -->

  <div class="spotlight"></div>


  <!-- MAIN AWARD SHOW SCREEN -->

  <main
    class="wrap"
    id="show"
  >

    <div class="presented">
      BAIT PRESENTS:
    </div>


    <h1>
      THE BEST OFs
      <br>
      AWARD SHOW!
    </h1>


    <div class="hosted">
      Hosted by DRAMA.
    </div>


    <div
      class="label"
      id="countdownLabel"
    >
      The show begins in
    </div>


    <!-- COUNTDOWN CLOCK -->

    <div
      id="countdown"
      aria-live="polite"
    >

      <!-- DAYS -->

      <div class="unit">

        <span
          class="number"
          id="days"
        >
          00
        </span>

        <span class="unit-name">
          Days
        </span>

      </div>


      <!-- HOURS -->

      <div class="unit">

        <span
          class="number"
          id="hours"
        >
          00
        </span>

        <span class="unit-name">
          Hours
        </span>

      </div>


      <!-- MINUTES -->

      <div class="unit">

        <span
          class="number"
          id="minutes"
        >
          00
        </span>

        <span class="unit-name">
          Minutes
        </span>

      </div>


      <!-- SECONDS -->

      <div class="unit">

        <span
          class="number"
          id="seconds"
        >
          00
        </span>

        <span class="unit-name">
          Seconds
        </span>

      </div>

    </div>


    <!-- SHOW DATE -->

    <div id="status">
      November 18, 2026 • 16:00 UTC
    </div>

  </main>


  <script>

    /*
    ==================================================
    BAIT AWARD SHOW COUNTDOWN
    ==================================================

    Target:

    November 18, 2026
    16:00 UTC

    The "Z" means UTC.

    Everyone worldwide will therefore reach
    zero at the exact same moment.

    No Start button is required.
    ==================================================
    */


    const target =
      Date.parse(
        "2026-11-18T16:00:00Z"
      );


    const show =
      document.getElementById(
        "show"
      );


    const status =
      document.getElementById(
        "status"
      );


    const countdownLabel =
      document.getElementById(
        "countdownLabel"
      );


    const ids = [
      "days",
      "hours",
      "minutes",
      "seconds"
    ];


    /*
    Add a leading zero.

    Example:

    5 becomes 05
    */

    function pad(value) {

      return String(value)
        .padStart(
          2,
          "0"
        );

    }


    /*
    Main countdown function
    */

    function updateCountdown() {

      /*
      Calculate how much time
      remains until 16:00 UTC.
      */

      const remaining =
        Math.max(
          0,
          target - Date.now()
        );


      /*
      Convert milliseconds
      into seconds.
      */

      const totalSeconds =
        Math.floor(
          remaining / 1000
        );


      /*
      DAYS
      */

      const days =
        Math.floor(
          totalSeconds /
          86400
        );


      /*
      HOURS
      */

      const hours =
        Math.floor(
          (
            totalSeconds %
            86400
          ) /
          3600
        );


      /*
      MINUTES
      */

      const minutes =
        Math.floor(
          (
            totalSeconds %
            3600
          ) /
          60
        );


      /*
      SECONDS
      */

      const seconds =
        totalSeconds %
        60;


      const values = [
        days,
        hours,
        minutes,
        seconds
      ];


      /*
      Update countdown numbers
      on the webpage.
      */

      ids.forEach(
        (id, index) => {

          document
            .getElementById(id)
            .textContent =
              pad(
                values[index]
              );

        }
      );


      /*
      When countdown reaches zero.
      */

      if (
        remaining <= 0
      ) {

        clearInterval(
          timer
        );


        show
          .classList
          .add(
            "live"
          );


        status.textContent =
          "THE SHOW IS LIVE!";


        countdownLabel
          .textContent =
            "IT IS TIME";

      }

    }


    /*
    IMPORTANT:

    Run the countdown immediately
    when somebody opens the page.

    There is NO Start button.
    */

    updateCountdown();


    /*
    Update every second.
    */

    const timer =
      setInterval(
        updateCountdown,
        1000
      );

  </script>

</body>
</html>
