<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Gaming Awards - Dry Run</title>
<style>
:root{--gold:#d7ad4b;--pale:#ffe89a;--bg:#050505}*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.stage{height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 28%,#3b2a0b 0,#111 32%,#030303 70%)}main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:5vw}.kicker{letter-spacing:.42em;color:var(--gold);font-size:clamp(12px,1.2vw,20px);margin-bottom:25px}.title{font-size:clamp(52px,8vw,130px);color:var(--pale);font-weight:900;text-shadow:0 0 35px #b77a1a88}.sub{font-size:clamp(18px,2.1vw,34px);color:#ddd;letter-spacing:.14em;margin-top:22px}.timer{font-size:clamp(96px,17vw,260px);font-weight:900;color:var(--pale);font-variant-numeric:tabular-nums;text-shadow:0 0 42px #c9942f99}.nominees{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:34px}.nominee{border:1px solid #8c6827;background:#0008;padding:35px 12px;border-radius:14px;font-size:clamp(20px,2vw,38px);font-weight:bold;color:#f3d77b}.winner{animation:pop .6s ease-out}@keyframes pop{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}footer{min-height:86px;background:#050505e8;border-top:1px solid #594417;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:14px}button{background:#111;color:#f4d87d;border:1px solid var(--gold);border-radius:9px;padding:13px 20px;font-weight:bold;cursor:pointer}button.primary{background:var(--gold);color:#070707}label{font-size:14px;color:#bbb}.status{width:100%;text-align:center;font-size:12px;color:#888}.confetti{position:fixed;width:9px;height:18px;top:-20px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:700px){.nominees{grid-template-columns:1fr 1fr}footer{min-height:130px}}
</style></head>
<body><div class="stage"><main id="screen"><div><div class="kicker">GLOBAL GAMING AWARDS · DRY RUN</div><div class="sub">THE SHOW BEGINS IN</div><div class="timer">00:10</div><div class="sub">PRESS START WHEN READY</div></div></main><footer><button class="primary" id="start">▶ START DRY RUN</button><button id="back">◀ BACK</button><button id="next">NEXT ▶</button><button id="restart">↻ RESTART</button><button id="fs">⛶ FULL SCREEN</button><label><input id="voice" type="checkbox" checked> Announcer voice</label><div class="status" id="status">Tip: in Discord, share this browser window and enable audio sharing.</div></footer></div>
<script>
const screen=document.getElementById('screen'),voice=document.getElementById('voice'),status=document.getElementById('status');let step=-1,timer=null;
function say(t){if(!voice.checked||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.86;u.pitch=.78;u.volume=1;speechSynthesis.speak(u)}
const pages=[
()=>show('GLOBAL GAMING AWARDS','2026','Players · Friendships · Legendary Moments','Ladies and gentlemen, wherever in the world you are joining us from, welcome to the Global Gaming Awards.'),
()=>show('AWARD #1','MOST POPULAR','THE PEOPLE’S CHOICE','It is time for our first award. This award cannot be bought. It cannot be grinded. And despite what some members of this server may believe, you cannot vote for yourself twelve times. Welcome to the Most Popular Award.'),
()=>{screen.innerHTML='<div style="width:min(1100px,95vw)"><div class="kicker">AND THE NOMINEES ARE...</div><div class="nominees"><div class="nominee">ALEX</div><div class="nominee">SARAH</div><div class="nominee">MIKE</div><div class="nominee">CHRIS</div></div></div>';say('And your nominees are. Alex. Sarah. Mike. Chris.')},
()=>show('AND THE AWARD FOR','MOST POPULAR','GOES TO...','Four nominees. But there can only be one. And the award for Most Popular goes to...'),
()=>reveal(),
()=>show('COMING UP NEXT','DYNAMIC DUO','BETTER TOGETHER','On to the next award. Dynamic Duo. Better together.')];
function show(k,t,s,spoken){screen.innerHTML=`<div><div class="kicker">${k}</div><div class="title winner">${t}</div><div class="sub">${s}</div></div>`;say(spoken)}
function reveal(){let n=3;screen.innerHTML=`<div><div class="kicker">WINNER REVEAL</div><div class="timer" id="n">3</div></div>`;say('Three');timer=setInterval(()=>{n--;if(n>0){document.getElementById('n').textContent=n;say(String(n))}else{clearInterval(timer);timer=null;setTimeout(()=>{screen.innerHTML='<div class="winner"><div class="kicker">🏆 WINNER 🏆</div><div class="title">SARAH</div><div class="sub">THE PEOPLE’S CHOICE</div><div class="sub" style="letter-spacing:0;color:#bbb">Loved by many. Blocked by surprisingly few.</div></div>';confetti();say('Sarah! You are officially the people’s choice. Loved by many. Blocked by surprisingly few. Congratulations.')},500)}},850)}
function countdown(){clear();let n=10;screen.innerHTML='<div><div class="kicker">GLOBAL GAMING AWARDS · 2026</div><div class="sub">THE SHOW BEGINS IN</div><div class="timer" id="c">00:10</div></div>';say('The show begins in ten seconds');timer=setInterval(()=>{n--;document.getElementById('c').textContent='00:'+String(n).padStart(2,'0');if(n<=3&&n>0)say(String(n));if(n===0){clearInterval(timer);timer=null;setTimeout(()=>{step=0;pages[0]()},650)}},1000)}
function clear(){if(timer){clearInterval(timer);timer=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function confetti(){for(let i=0;i<80;i++){let d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=['#d7ad4b','#ffe89a','#fff','#9f7428'][i%4];d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}}
document.getElementById('start').onclick=countdown;document.getElementById('next').onclick=()=>{clear();step=Math.min(step+1,pages.length-1);pages[step]()};document.getElementById('back').onclick=()=>{clear();step=Math.max(step-1,0);pages[step]()};document.getElementById('restart').onclick=()=>{clear();step=-1;screen.innerHTML='<div><div class="kicker">GLOBAL GAMING AWARDS · DRY RUN</div><div class="sub">THE SHOW BEGINS IN</div><div class="timer">00:10</div><div class="sub">PRESS START WHEN READY</div></div>';status.textContent='Ready for another dry run.'};document.getElementById('fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
